<style>
.umenu-wrap { position:relative; }
.umenu { position:absolute; right:calc(100% + 10px); top:-6px; background:var(--card,#fff); border:1px solid var(--border,#e5e5e5); border-radius:12px; min-width:170px; box-shadow:0 10px 30px rgba(0,0,0,.14); z-index:200; overflow:hidden; }
.umenu .uemail { padding:10px 14px; font-size:.78rem; color:var(--muted,#6b6b6b); border-bottom:1px solid var(--border,#e5e5e5); word-break:break-all; }
.umenu button { display:block; width:100%; text-align:left; padding:11px 14px; background:none; border:none; font-size:.92rem; color:var(--text,#1a1a1a); cursor:pointer; }
.umenu button:hover { background:rgba(128,128,128,.12); }
.umenu button + button { border-top:1px solid var(--border,#e5e5e5); }
.auth-input { width:100%; padding:10px 12px; font-size:1rem; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; margin:6px 0; }
</style>

<body>
<header class="site-header">
  <div class="wrap header-inner">
    <span class="brand-row"><a class="brand" href="#" id="brandGate">万能手</a></span>
    <nav class="main-nav">
      <a href="#" data-nav="home" aria-label="文章"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></a> <a href="shop.html" aria-label="购物"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></a>
    </nav>
    <div class="header-tools">

<div class="umenu-wrap">
        <button class="icon-btn gear-btn" id="userBtn" aria-label="用户菜单"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><defs><mask id="gearHole"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="12" r="2.6" fill="#000"/></mask></defs><g class="gear-fill" fill="#1a1a1a" mask="url(#gearHole)"><circle cx="12" cy="12" r="6.4"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(45 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(90 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(135 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(180 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(225 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(270 12 12)"/><rect x="10.9" y="2.2" width="2.2" height="4.6" rx="1" transform="rotate(315 12 12)"/></g></svg></button>
        <div class="umenu hidden" id="userMenu"></div>

<button class="icon-btn" id="searchToggle" aria-label="搜索">🔍</button>
      <button class="icon-btn" id="themeToggle" aria-label="切换深色模式">🌙</button>

    <input type="search" id="searchInput" placeholder="搜索文章标题、内容…">

<main class="wrap" id="app">
  <!-- 首页 -->

      <h2>最新文章</h2>
    </div>

<script src="app.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="authModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;border-radius:14px;padding:26px 24px;width:320px;text-align:center;color:#1a1a1a;">
    <div id="authMainBox">
    <p id="authTitle" style="margin:0 0 4px;font-weight:700;font-size:1.05rem;">登录</p>
    <p id="authHint" style="margin:0 0 6px;color:#6b6b6b;font-size:.83rem;"></p>
    <input type="email" id="authEmail" class="auth-input" placeholder="邮箱" autocomplete="email">
    <input type="password" id="authPwd" class="auth-input" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <p id="authErr" style="display:none;color:#b3261e;font-size:.85rem;margin:8px 0 0;"></p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button id="authCancel" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;">取消</button>
      <button id="authGo" style="flex:1;padding:10px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;font-weight:700;cursor:pointer;">登录</button>
    </div>
    <p style="margin:12px 0 0;font-size:.85rem;"><a href="#" id="authSwitch" style="color:#1a73e8;">没有账号？去注册</a></p>
    <p id="authForgotRow" style="margin:8px 0 0;font-size:.85rem;"><a href="#" id="authForgot" style="color:#1a73e8;">忘记密码？</a></p>
    </div>
    <div id="authResetBox" style="display:none;">
    <p style="margin:0 0 4px;font-weight:700;font-size:1.05rem;">找回密码</p>
    <p style="margin:0 0 6px;font-size:.85rem;color:#6b6b6b;">输入注册时用的邮箱，我们会发一封重置邮件，点邮件里的链接设置新密码。</p>
    <input type="email" id="resetEmail" class="auth-input" placeholder="注册时用的邮箱" autocomplete="email">
    <p id="resetErr" style="display:none;color:#b3261e;font-size:.85rem;margin:8px 0 0;"></p>
    <p id="resetOk" style="display:none;color:#2e7d32;font-size:.85rem;margin:8px 0 0;"></p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button id="resetBack" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;">返回</button>
      <button id="resetGo" style="flex:1;padding:10px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;font-weight:700;cursor:pointer;">发送重置邮件</button>
    </div>
    </div>
    <div id="authNewPwBox" style="display:none;">
    <p style="margin:0 0 4px;font-weight:700;font-size:1.05rem;">设置新密码</p>
    <input type="password" id="newPw1" class="auth-input" placeholder="新密码（至少 6 位）" autocomplete="new-password">
    <input type="password" id="newPw2" class="auth-input" placeholder="再输入一次新密码" autocomplete="new-password">
    <p id="newPwErr" style="display:none;color:#b3261e;font-size:.85rem;margin:8px 0 0;"></p>
    <div style="margin-top:14px;">
      <button id="newPwGo" style="width:100%;padding:10px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;font-weight:700;cursor:pointer;">保存新密码</button>
    </div>
    </div>
  </div>
</div>
<script>
(function(){
  var SB_URL = "https://vvwyheyojnmeyzbisxnq.supabase.co";
  var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2d3loZXlvam5tZXl6YmlzeG5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTE0MTQsImV4cCI6MjEwNjE4NzQxNH0.U2ZMJZbgm-5cxP7M383ymjX22UW9ZuvtgU8owXV8oR8";
  var sb = (window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null);
  /* 访客统计：记录今日访客 + 在线心跳（每天每访客只记一次，北京时间凌晨自动从 0 开始） */
  (function(){
    try{
      var k = "visitor_id", vid = null;
      try{ vid = localStorage.getItem(k); }catch(e){}
      if(!vid){ vid = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try{ localStorage.setItem(k, vid); }catch(e){} }
      function ping(){ if(sb && vid){ try{ sb.rpc("log_visit", { p_visitor_id: vid }).then(function(){}, function(){}); }catch(e){} } }
      ping();
      setInterval(ping, 3*60*1000);
      window.addEventListener("pagehide", ping);
    }catch(e){}
  })();
  var myUser = null, authMode = "login";
  function renderUserMenu(){
    var m = document.getElementById("userMenu");
    if(!m) return;
    m.innerHTML = "";
    if(myUser){
      var em = document.createElement("div"); em.className = "uemail"; em.textContent = myUser.email || "已登录";
      m.appendChild(em);
      var od = document.createElement("button"); od.textContent = "我的订单";
      od.onclick = function(){ toggleUserMenu(false); location.href = "shop.html#myorders"; };
      m.appendChild(od);
      var out = document.createElement("button"); out.textContent = "退出";
      out.onclick = function(){ toggleUserMenu(false); if(sb) sb.auth.signOut(); };
      m.appendChild(out);
    } else {
      var li = document.createElement("button"); li.textContent = "登录";
      li.onclick = function(){ toggleUserMenu(false); openAuth(""); };
      m.appendChild(li);
    }
  }
  function toggleUserMenu(force){
    var m = document.getElementById("userMenu");
    if(!m) return;
    var showIt = (typeof force === "boolean") ? force : m.classList.contains("hidden");
    m.classList.toggle("hidden", !showIt);
  }
  function openAuth(hint){
    authMode = "login";
    authShowBox("authMainBox");
    document.getElementById("authForgotRow").style.display = "";
    document.getElementById("authTitle").textContent = "登录";
    document.getElementById("authGo").textContent = "登录";
    document.getElementById("authSwitch").textContent = "没有账号？去注册";
    document.getElementById("authHint").textContent = hint || "";
    document.getElementById("authErr").style.display = "none";
    document.getElementById("authModal").classList.remove("hidden");
    setTimeout(function(){ document.getElementById("authEmail").focus(); }, 50);
  }
  function closeAuth(){ document.getElementById("authModal").classList.add("hidden"); }
  function authError(msg){ var e = document.getElementById("authErr"); e.textContent = msg; e.style.display = "block"; }
  document.getElementById("authCancel").onclick = closeAuth;
  document.getElementById("authSwitch").onclick = function(e){
    e.preventDefault();
    authMode = (authMode === "login") ? "signup" : "login";
    document.getElementById("authTitle").textContent = (authMode === "login") ? "登录" : "注册";
    document.getElementById("authGo").textContent = (authMode === "login") ? "登录" : "注册";
    document.getElementById("authSwitch").textContent = (authMode === "login") ? "没有账号？去注册" : "已有账号？去登录";
    document.getElementById("authForgotRow").style.display = (authMode === "login") ? "" : "none";
    document.getElementById("authErr").style.display = "none";
  };
  document.getElementById("authGo").onclick = function(){
    var email = document.getElementById("authEmail").value.trim();
    var pwd = document.getElementById("authPwd").value;
    if(!email || !pwd) return authError("请填写邮箱和密码。");
    if(pwd.length < 6) return authError("密码至少 6 位。");
    document.getElementById("authGo").disabled = true;
    var job = (authMode === "login") ? sb.auth.signInWithPassword({ email: email, password: pwd }) : sb.auth.signUp({ email: email, password: pwd });
    job.then(function(r){
      document.getElementById("authGo").disabled = false;
      if(r.error) return authError(r.error.message === "Invalid login credentials" ? "邮箱或密码不对。" : r.error.message);
      closeAuth();
    }).catch(function(e){ document.getElementById("authGo").disabled = false; authError("出错了：" + e.message); });
  };
  document.getElementById("authPwd").addEventListener("keydown", function(e){ if(e.key === "Enter") document.getElementById("authGo").click(); });
  /* 忘记密码：发重置邮件 → 点邮件链接回来 → 设置新密码 */
  function authShowBox(which){
    ["authMainBox", "authResetBox", "authNewPwBox"].forEach(function(id){
      document.getElementById(id).style.display = (id === which) ? "block" : "none";
    });
  }
  document.getElementById("authForgot").onclick = function(e){
    e.preventDefault();
    document.getElementById("resetErr").style.display = "none";
    document.getElementById("resetOk").style.display = "none";
    var em = document.getElementById("authEmail").value.trim();
    if(em) document.getElementById("resetEmail").value = em;
    authShowBox("authResetBox");
  };
  document.getElementById("resetBack").onclick = function(){ authShowBox("authMainBox"); };
  document.getElementById("resetGo").onclick = function(){
    var email = document.getElementById("resetEmail").value.trim();
    var errEl = document.getElementById("resetErr"), okEl = document.getElementById("resetOk");
    errEl.style.display = "none"; okEl.style.display = "none";
    if(!email){ errEl.textContent = "请填写邮箱。"; errEl.style.display = "block"; return; }
    var btn = document.getElementById("resetGo"); btn.disabled = true;
    sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(function(r){
      btn.disabled = false;
      if(r.error){ errEl.textContent = "发送失败：" + r.error.message; errEl.style.display = "block"; return; }
      okEl.textContent = "重置邮件已发送，请去邮箱点链接设置新密码（没收到的话看看垃圾箱）。";
      okEl.style.display = "block";
    }).catch(function(e){ btn.disabled = false; errEl.textContent = "发送失败：" + e.message; errEl.style.display = "block"; });
  };
  document.getElementById("newPwGo").onclick = function(){
    var p1 = document.getElementById("newPw1").value, p2 = document.getElementById("newPw2").value;
    var errEl = document.getElementById("newPwErr"); errEl.style.display = "none";
    if(p1.length < 6){ errEl.textContent = "密码至少 6 位。"; errEl.style.display = "block"; return; }
    if(p1 !== p2){ errEl.textContent = "两次输入的新密码不一致。"; errEl.style.display = "block"; return; }
    var btn = document.getElementById("newPwGo"); btn.disabled = true;
    sb.auth.updateUser({ password: p1 }).then(function(r){
      btn.disabled = false;
      if(r.error){ var m = r.error.message || ""; if(m.indexOf("different from the old password") !== -1) m = "新密码不能和旧密码相同，请换一个。"; errEl.textContent = "保存失败：" + m; errEl.style.display = "block"; return; }
      document.getElementById("newPw1").value = ""; document.getElementById("newPw2").value = "";
      closeAuth(); authShowBox("authMainBox");
      alert("新密码已保存，直接用新密码登录就行。");
    }).catch(function(e){ btn.disabled = false; errEl.textContent = "保存失败：" + e.message; errEl.style.display = "block"; });
  };
  document.getElementById("authModal").addEventListener("click", function(e){ if(e.target === document.getElementById("authModal")) closeAuth(); });
  /* 标题入口：管理员点一下直接进后台，其他人点回首页 */
  (function(){
    var bg = document.getElementById("brandGate");
    if(!bg) return;
    bg.addEventListener("click", async function(e){
      e.preventDefault();
      try{
        if(sb){
          var s = await sb.auth.getSession();
          var u = (s.data && s.data.session) ? s.data.session.user : null;
          if(u){
            var p = await sb.from("profiles").select("is_admin").eq("id", u.id).single();
            if(p.data && p.data.is_admin){ location.href = "admin/"; return; }
          }
        }
      }catch(e){}
      show("home");
    });
  })();
  async function refreshAuth(){
    if(!sb) return;
    try{ var r = await sb.auth.getUser(); myUser = (r.data && r.data.user) ? r.data.user : null; }
    catch(e){ myUser = null; }
    renderUserMenu();
  }
  if(sb){ sb.auth.onAuthStateChange(function(event){ if(event === "PASSWORD_RECOVERY"){ authShowBox("authNewPwBox"); document.getElementById("newPwErr").style.display = "none"; document.getElementById("authModal").classList.remove("hidden"); return; } refreshAuth(); }); refreshAuth(); }
  else { renderUserMenu(); }
  document.getElementById("userBtn").onclick = function(e){ e.stopPropagation(); toggleUserMenu(); };
  document.addEventListener("click", function(){ toggleUserMenu(false); });
})();
</script>
</body>
</html>
